<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Pagar com Pix · RJ Domótica</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#e8eaed;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}
.c{width:100%;max-width:420px;background:#14171c;border:1px solid #262a31;border-radius:18px;padding:24px}
small{color:#38d6f5;letter-spacing:.18em;font-size:11px;font-weight:700}
h1{font-size:21px;margin:8px 0 6px}p{color:#9aa3ad;font-size:14px;line-height:1.5;margin:0 0 16px}
code{display:block;background:#0b0d10;border:1px solid #262a31;border-radius:10px;padding:12px;font-size:12px;word-break:break-all;margin-bottom:16px;max-height:120px;overflow:auto}
button{width:100%;border:0;border-radius:12px;background:#38d6f5;color:#0b0d10;font-weight:700;font-size:16px;padding:15px;cursor:pointer}
.ok{background:#37d67a}.m{margin-top:14px;font-size:13px;color:#9aa3ad;text-align:center}
</style></head><body><div class="c">
<small>RJ DOMÓTICA · RASTREAMENTO</small>
<h1>Pagar com Pix</h1>
<p>Toque no botão, abra o app do seu banco e escolha <b>Pix Copia e Cola</b>. A confirmação é na hora.</p>
<code id="cod">Código não encontrado. Use o link do e-mail novamente.</code>
<button id="b">Copiar Pix</button>
<div class="m" id="m"></div>
</div>
<script>
var c=decodeURIComponent((location.hash||'').slice(1));
var cod=document.getElementById('cod'),b=document.getElementById('b'),m=document.getElementById('m');
if(c&&c.length>20)cod.textContent=c;else b.disabled=true;
function ok(){b.textContent='Pix copiado ✓';b.className='ok';m.textContent='Agora cole no app do seu banco.'}
b.onclick=function(){
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(c).then(ok,fb)}else fb();
  function fb(){var t=document.createElement('textarea');t.value=c;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();t.setSelectionRange(0,99999);try{document.execCommand('copy')?ok():m.textContent='Segure no código acima para copiar.'}catch(e){m.textContent='Segure no código acima para copiar.'}document.body.removeChild(t)}
};
</script></body></html>
