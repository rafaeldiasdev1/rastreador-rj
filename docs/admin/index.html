<style>
:root{--bg:#0b0d10;--sf:#15181d;--sf2:#101317;--ln:#262a31;--tx:#e8eaed;--mu:#9aa3ad;--ci:#38d6f5;--la:#ff8a3d;--vd:#4ade80;--vm:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--ci)}
.orb{font-family:Orbitron,sans-serif;letter-spacing:1px}
.oculto{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(56,214,245,.1),transparent 60%)}
.caixa{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.caixa img{width:100%;height:auto}
/* layout */
#app{display:flex;min-height:100vh;flex-wrap:wrap}
aside{width:232px;flex:0 0 232px;background:var(--sf2);border-right:1px solid var(--ln);padding:14px 12px;display:flex;flex-direction:column;gap:4px}
aside img{width:100%;height:auto;margin-bottom:6px}
aside .tag{font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:3px;color:var(--ci);padding:0 10px 12px}
aside a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);text-decoration:none;font-weight:600}
aside a:hover{background:#181c22;color:var(--tx)}
aside a.ativo{background:rgba(56,214,245,.1);color:var(--ci)}
aside .rod{margin-top:auto;font-size:12px;color:var(--mu);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
main{flex:999 1 600px;min-width:0;padding:24px 28px 60px}
@media(max-width:820px){aside{width:100%;flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--ln)}aside img{width:150px;margin:0}aside .tag,aside .rod span{display:none}aside .rod{margin:0;flex-direction:row;padding:0}main{padding:18px 14px 60px}}
h1{margin:0;font-family:Orbitron,sans-serif;font-size:22px;letter-spacing:1px}
h2{margin:0 0 12px;font-size:15px;font-weight:700}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px}
.card small{color:var(--mu);font-size:12px;display:block}
.card b{font-family:Orbitron,sans-serif;font-size:22px;display:block;margin-top:6px}
.painel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.tab{width:100%;border-collapse:collapse}
.tab th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
.tab td{padding:10px;border-bottom:1px solid #1d2128;vertical-align:middle}
.tab tr:last-child td{border-bottom:none}
.tab tr.click{cursor:pointer}.tab tr.click:hover td{background:#181c22}
.rolagem{overflow-x:auto}
.mu{color:var(--mu)}.pq{font-size:12px}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.b-ok{color:var(--vd);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08)}
.b-ci{color:var(--ci);border-color:rgba(56,214,245,.4);background:rgba(56,214,245,.08)}
.b-la{color:var(--la);border-color:rgba(255,138,61,.45);background:rgba(255,138,61,.1)}
.b-vm{color:var(--vm);border-color:rgba(255,107,107,.45);background:rgba(255,107,107,.1)}
.b-mu{color:var(--mu);border-color:var(--ln);background:var(--sf2)}
.btn{height:40px;padding:0 16px;border-radius:12px;border:none;background:var(--ci);color:#0b0d10;font-weight:700;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn2{height:40px;padding:0 14px;border-radius:12px;border:1px solid #333944;background:transparent;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn2:hover{border-color:#4a515d}
.btn-la{background:var(--la)}
.btn-vm{border-color:rgba(255,107,107,.5);color:var(--vm)}
.mini{height:32px;padding:0 10px;font-size:12px;border-radius:10px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.busca{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{background:var(--sf2);border:1px solid #2c313a;border-radius:12px;padding:0 12px;height:42px;color:var(--tx);min-width:0}
textarea{padding:10px 12px;height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(56,214,245,.5);outline-offset:0;border-color:transparent}
.campo{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mu);font-weight:600}
.campo.req>span::after{content:" *";color:var(--la)}
.form{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}.c1{grid-column:span 1}
@media(max-width:700px){.c8,.c7,.c6,.c5,.c4,.c3,.c2,.c1{grid-column:span 12}}
.sec{grid-column:span 12;font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:2px;color:var(--ci);margin-top:8px;padding-top:12px;border-top:1px solid var(--ln)}
.chk{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tx);font-weight:500}
.chk input{width:20px;height:20px;accent-color:var(--ci)}
.ag-item{display:flex;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--ln);cursor:pointer;border-radius:8px}.ag-item:hover{background:#181c22}
.ag-hora{min-width:52px;text-align:center;font-weight:700;color:var(--ci);font-size:14px;line-height:1.2}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cab{text-align:center;font-size:11px;color:var(--mu);padding:4px 0;text-transform:uppercase;letter-spacing:1px}
.cal-dia{min-height:78px;background:#0f1216;border:1px solid var(--ln);border-radius:8px;padding:4px 5px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--tx);cursor:pointer;overflow:hidden}
.cal-dia span{font-size:12px;font-weight:700;color:var(--mu)}
.cal-dia i{font-style:normal;font-size:11px;background:rgba(56,214,245,.14);color:var(--ci);border-radius:4px;padding:1px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-dia i.ok{background:rgba(61,220,132,.14);color:#7fe3a8}
.cal-dia.hoje{border-color:var(--ci)}.cal-dia.hoje span{color:var(--ci)}
.cal-dia.sel{background:#16202a;border-color:#3a6f80}
@media(max-width:700px){.cal-dia{min-height:54px}.cal-dia i{font-size:9px;padding:0 2px}}
.abas{display:flex;gap:6px;border-bottom:1px solid var(--ln);margin-bottom:16px;flex-wrap:wrap}
.abas button{background:none;border:none;border-bottom:2px solid transparent;padding:10px 12px;color:var(--mu);font-weight:600}
.abas button.ativo{color:var(--ci);border-color:var(--ci)}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:50;overflow-y:auto}
.modal{width:100%;max-width:760px;background:var(--sf);border:1px solid #2c313a;border-radius:20px;padding:22px}
.modal.p{max-width:460px}
.modal .cab{margin-bottom:16px}
.toast{position:fixed;right:18px;bottom:18px;z-index:80;background:var(--sf);border:1px solid rgba(56,214,245,.5);border-radius:14px;padding:12px 16px;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translateY(150%);transition:transform .25s}
.toast.on{transform:none}.toast.erro{border-color:rgba(255,107,107,.6)}
.vazio{padding:24px;text-align:center;color:var(--mu)}
.erro{color:#ffb38a;font-size:13px;min-height:18px}
.integ{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #1d2128}
.integ:last-child{border-bottom:none}

const dataHora = (d) => d ? new Date(d).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
const mesBR = (c) => c ? new Date(c + 'T12:00:00Z').toLocaleDateString('pt-BR', { month: 'short', year: 'numeric', timeZone: 'UTC' }) : '—';
const so = (s) => String(s || '').replace(/\D/g, '');
const hoje = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date());
let sessao = null;

/* ---------- utilidades de interface ---------- */
let tT;
function toast(msg, erro) { const t = $('#toast'); t.textContent = msg; t.className = 'toast on' + (erro ? ' erro' : ''); clearTimeout(tT); tT = setTimeout(() => t.className = 'toast', 4500); }
function modal(html, pequeno) {
  const r = $('#modal-raiz');
  r.innerHTML = '<div class="fundo"><div class="modal' + (pequeno ? ' p' : '') + '" role="dialog" aria-modal="true">' + html + '</div></div>';
  const f = $('.fundo', r);
  f.addEventListener('mousedown', (e) => { if (e.target === f) fecharModal(); });
  setTimeout(() => { const i = $('input,select,textarea', r); if (i) i.focus(); }, 30);
  return $('.modal', r);
}
function fecharModal() { $('#modal-raiz').innerHTML = ''; }
function confirmar(titulo, texto, rotulo = 'Confirmar', perigo) {
  return new Promise((ok) => {
    const m = modal('<div class="cab"><h1 style="font-size:17px">' + esc(titulo) + '</h1></div><p class="mu" style="line-height:1.6;margin:0 0 18px">' + esc(texto) + '</p><div class="acoes" style="justify-content:flex-end"><button class="btn2" data-v="0">Cancelar</button><button class="btn' + (perigo ? ' btn-la' : '') + '" data-v="1">' + esc(rotulo) + '</button></div>', true);
    $$('button', m).forEach((b) => b.onclick = () => { fecharModal(); ok(b.dataset.v === '1'); });
  });
}
async function api(acao, dados = {}) {
  const r = await fetch(SB_URL + '/functions/v1/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY, Authorization: 'Bearer ' + sessao.access_token }, body: JSON.stringify({ acao, ...dados }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || d.erro) throw new Error(d.erro || 'Falha na operação (' + r.status + ')');
  return d;
}
const chk = (res) => { if (res.error) throw new Error(traduzErro(res.error.message)); return res.data; };
function traduzErro(m) {
  if (/duplicate key.*documento/.test(m)) return 'Já existe um cliente com este CPF/CNPJ.';
  if (/duplicate key.*placa/.test(m)) return 'Já existe um veículo com esta placa.';
  if (/duplicate key.*imei/.test(m)) return 'Este IMEI já está em outro veículo.';
  if (/duplicate key.*chip_iccid/.test(m)) return 'Este chip (ICCID) já está em outro veículo.';
  if (/chip_iccid_formato/.test(m)) return 'ICCID inválido: são 18 a 22 dígitos começando com 89.';
  if (/row-level security/.test(m)) return 'Sua conta não tem permissão de administrador.';
  return m;
}
async function rodar(btn, fn) {
  const t = btn ? btn.innerHTML : ''; if (btn) { btn.disabled = true; btn.textContent = 'Aguarde…'; }
  try { return await fn(); } catch (e) { toast(e.message, true); } finally { if (btn) { btn.disabled = false; btn.innerHTML = t; } }
}
function situacao(c) {
  if (c.status === 'pre_cadastro') return '<span class="badge b-la">Pré-cadastro</span>';
  if (c.status === 'cancelado') return '<span class="badge b-mu">Cancelado</span>';
  if (c.status === 'bloqueado') return '<span class="badge b-vm">Bloqueado</span>';
  if (c.situacao === 'inadimplente') return '<span class="badge b-la">Em atraso · ' + c.dias_uteis_atraso + ' dia(s) útil(eis)</span>';
  if (c.situacao === 'a_vencer') return '<span class="badge b-ci">A vencer ' + dataBR(c.proximo_vencimento) + '</span>';
  return '<span class="badge b-ok">Em dia</span>';
}
function statusCob(c) {
  if (c.status === 'pago') return '<span class="badge b-ok">Pago' + (c.forma_pagamento ? ' · ' + esc(c.forma_pagamento) : '') + '</span>';
  if (c.status === 'cancelado') return '<span class="badge b-mu">Cancelado</span>';
  if (c.vencimento < hoje()) return '<span class="badge b-la">Vencido</span>';
  return '<span class="badge b-ci">Em aberto</span>';
}
const fmtFone = (f) => { const d = so(f).replace(/^55/, ''); return d.length === 11 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7) : d.length === 10 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6) : f || '—'; };
const fmtDoc = (d) => { d = so(d); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : d.length === 14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : d; };
function cpfValido(c) { c = so(c); if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false; for (let t = 9; t < 11; t++) { let s = 0; for (let i = 0; i < t; i++) s += c[i] * (t + 1 - i); if (((10 * s) % 11) % 10 != c[t]) return false; } return true; }
function cnpjValido(c) { c = so(c); if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false; const calc = (n) => { let s = 0, p = n - 7; for (let i = 0; i < n; i++) { s += c[i] * p--; if (p < 2) p = 9; } const r = s % 11; return r < 2 ? 0 : 11 - r; }; return calc(12) == c[12] && calc(13) == c[13]; }
function gerarSenha() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; const v = crypto.getRandomValues(new Uint32Array(10)); return [...v].map((x) => a[x % a.length]).join(''); }
async function copiar(txt) { try { await navigator.clipboard.writeText(txt); toast('Copiado.'); } catch (e) { toast('Não consegui copiar automaticamente.', true); } }

/* ---------- login ---------- */
async function iniciar() {
  const { data } = await sb.auth.getSession();
  sessao = data.session;
  if (!sessao) return mostrarLogin();
  const { data: ok } = await sb.rpc('primeiro_admin');
  if (!ok) { await sb.auth.signOut(); mostrarLogin('Esta conta não é de administrador.'); return; }
  $('#login').classList.add('oculto'); $('#app').classList.remove('oculto');
  $('#quem').textContent = sessao.user.email;
  rota();
}
function mostrarLogin(msg) { $('#app').classList.add('oculto'); $('#login').classList.remove('oculto'); $('#l-erro').textContent = msg || ''; }
$('#f-login').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#l-erro').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#l-email').value.trim(), password: $('#l-senha').value });
  if (error) { $('#l-erro').textContent = /confirm/i.test(error.message) ? 'Confirme seu e-mail pelo link que enviamos e tente de novo.' : 'E-mail ou senha incorretos.'; return; }
  iniciar();
});
$('#l-criar').addEventListener('click', async () => {
  const email = $('#l-email').value.trim(), senha = $('#l-senha').value;
  if (!email || senha.length < 8) { $('#l-erro').textContent = 'Preencha o e-mail e uma senha com pelo menos 8 caracteres.'; return; }
  const { data, error } = await sb.auth.signUp({ email, password: senha, options: { emailRedirectTo: location.href.split('#')[0] } });
  if (error) { $('#l-erro').textContent = error.message; return; }
  if (!data.session) { $('#l-erro').textContent = 'Conta criada. Abra o link de confirmação enviado para ' + email + ' e depois entre aqui.'; return; }
  iniciar();
});
$('#sair').addEventListener('click', async () => { await sb.auth.signOut(); location.hash = ''; mostrarLogin(); });
sb.auth.onAuthStateChange((_e, s) => { sessao = s; });

/* ---------- rotas ---------- */
function rota() {

  const [r, id] = (location.hash.slice(1) || 'inicio').split('-c-');

  fecharModal();
  const telas = { inicio: telaInicio, clientes: telaClientes, cliente: () => telaCliente(id), cobrancas: telaCobrancas, os: telaOS, instaladores: telaInstaladores, equipe: telaEquipe, mensagens: telaMensagens, config: telaConfig };
  (telas[r] || telaInicio)();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', rota);
const abrirCliente = (id) => { location.hash = 'cliente-c-' + id; };

    sb.from('v_clientes').select('*').then(chk),

    sb.from('historico').select('*, clientes(nome)').order('created_at', { ascending: false }).limit(12).then(chk),
    sb.from('veiculos').select('id', { count: 'exact', head: true }).eq('ativo', true),
  ]).catch((e) => { m.querySelector('.vazio').textContent = e.message; return []; });
  if (!clis || !$('#b-rotina')) return;
  const pre = clis.filter((c) => c.status === 'pre_cadastro').length, ativos = clis.filter((c) => c.status === 'ativo').length, bloq = clis.filter((c) => c.status === 'bloqueado').length;
  const inad = clis.filter((c) => c.situacao === 'inadimplente');
  const pagosMes = cobs.filter((c) => c.status === 'pago' && c.pago_em && c.pago_em.slice(0, 7) === h.slice(0, 7));
  const recebido = pagosMes.reduce((s, c) => s + Number(c.valor_pago || c.valor), 0);
  const aReceber = cobs.filter((c) => c.status === 'pendente' && c.vencimento.slice(0, 7) === h.slice(0, 7)).reduce((s, c) => s + Number(c.valor), 0);
  const emAtraso = inad.reduce((s, c) => s + Number(c.valor_aberto || 0), 0);
  const prox = cobs.filter((c) => c.status === 'pendente' && c.vencimento >= h).sort((a, b) => a.vencimento.localeCompare(b.vencimento)).slice(0, 8);
  m.innerHTML = `<div class="cab"><h1>Visão geral</h1><button class="btn2" id="b-rotina">Rodar rotina de cobrança agora</button></div>
  <div class="cards">
    <div class="card"><small>Clientes ativos</small><b>${ativos}</b></div>
    <div class="card"><small>Pré-cadastros</small><b style="color:var(--la)">${pre}</b></div>
    <div class="card"><small>Bloqueados</small><b style="color:var(--vm)">${bloq}</b></div>
    <div class="card"><small>Em atraso</small><b style="color:var(--la)">${inad.length}</b></div>
    <div class="card"><small>Veículos rastreados</small><b>${veics.count ?? 0}</b></div>
    <div class="card"><small>Recebido no mês</small><b style="font-size:18px;color:var(--vd)">${brl(recebido)}</b></div>
    <div class="card"><small>A receber no mês</small><b style="font-size:18px">${brl(aReceber)}</b></div>
    <div class="card"><small>Valor em atraso</small><b style="font-size:18px;color:var(--la)">${brl(emAtraso)}</b></div>
  </div>
  <div class="grid2">
    <div class="painel"><h2>Inadimplentes</h2>${inad.length ? `<div class="rolagem"><table class="tab"><thead><tr><th>Cliente</th><th>Venceu</th><th>Valor</th><th>Situação</th></tr></thead><tbody>${inad.sort((a, b) => b.dias_uteis_atraso - a.dias_uteis_atraso).map((c) => `<tr class="click" data-id="${c.id}"><td>${esc(c.nome)}</td><td>${dataBR(c.proximo_vencimento)}</td><td>${brl(c.valor_aberto)}</td><td>${situacao(c)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="vazio">Ninguém em atraso.</div>'}</div>

/* ---------- clientes ---------- */
async function telaClientes() {
  const m = $('#main');
  m.innerHTML = `<div class="cab"><h1>Clientes</h1><button class="btn" id="b-novo">+ Novo cliente</button></div>
  <div class="busca"><input id="q" placeholder="Buscar por nome, CPF/CNPJ, placa ou telefone" style="flex:1 1 280px" aria-label="Buscar">
  <select id="fs" aria-label="Filtrar situação"><option value="">Todas as situações</option><option value="em_dia">Em dia</option><option value="a_vencer">A vencer</option><option value="inadimplente">Em atraso</option><option value="pre_cadastro">Pré-cadastros</option><option value="bloqueado">Bloqueados</option><option value="cancelado">Cancelados</option></select></div>
  <div class="painel" style="padding:4px 8px"><div class="rolagem" id="lista"><div class="vazio">Carregando…</div></div></div>`;
  $('#b-novo').onclick = () => formCliente();
  let clis = [], placas = {};
  try {
    [clis] = await Promise.all([sb.from('v_clientes').select('*').order('nome').then(chk)]);
    const vs = await sb.from('veiculos').select('cliente_id, placa').then(chk);
    vs.forEach((v) => { (placas[v.cliente_id] = placas[v.cliente_id] || []).push(v.placa); });
  } catch (e) { if ($('#lista')) $('#lista').innerHTML = '<div class="vazio">' + esc(e.message) + '</div>'; return; }
  if (!$('#q')) return; // saiu da tela enquanto carregava
  const desenhar = () => {
    const q = $('#q').value.trim().toLowerCase(), qd = so(q), fs = $('#fs').value;
    const l = clis.filter((c) => {
      if (fs === 'pre_cadastro' && c.status !== 'pre_cadastro') return false;
      if (fs === 'bloqueado' && c.status !== 'bloqueado') return false;
      if (fs === 'cancelado' && c.status !== 'cancelado') return false;
      if (['em_dia', 'a_vencer', 'inadimplente'].includes(fs) && (c.situacao !== fs || c.status === 'bloqueado')) return false;
      if (!q) return true;
      return c.nome.toLowerCase().includes(q) || (qd && (so(c.documento).includes(qd) || so(c.whatsapp).includes(qd))) || (placas[c.id] || []).some((p) => p.toLowerCase().includes(q.replace(/[^a-z0-9]/g, '')));
    });
    $('#lista').innerHTML = l.length ? `<table class="tab"><thead><tr><th>Cliente</th><th>CPF/CNPJ</th><th>WhatsApp</th><th>Veículos</th><th>Mensalidade</th><th>Situação</th></tr></thead><tbody>${l.map((c) => `<tr class="click" data-id="${c.id}"><td><b>${esc(c.nome)}</b><div class="mu pq">${esc(c.email)}</div></td><td>${fmtDoc(c.documento)}</td><td>${fmtFone(c.whatsapp)}</td><td>${(placas[c.id] || []).map(esc).join(', ') || '<span class="mu">—</span>'}</td><td>${brl(c.valor_mensal)}<div class="mu pq">todo dia ${c.dia_vencimento}</div></td><td>${situacao(c)}</td></tr>`).join('')}</tbody></table>` : `<div class="vazio">${clis.length ? 'Nenhum cliente encontrado.' : 'Nenhum cliente cadastrado ainda. Comece em "+ Novo cliente".'}</div>`;
    $$('tr.click', $('#lista')).forEach((tr) => tr.onclick = () => abrirCliente(tr.dataset.id));
  };
  $('#q').oninput = desenhar; $('#fs').onchange = desenhar; desenhar();

      if (!f.logradouro.value) f.logradouro.value = r.logradouro || ''; if (!f.bairro.value) f.bairro.value = r.bairro || '';
      f.cidade.value = r.localidade || f.cidade.value; f.uf.value = r.uf || f.uf.value; f.numero.focus();
    } catch (e) {}
  });
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('#fc-erro', m); err.textContent = '';
    const v = Object.fromEntries(new FormData(f).entries());
    const doc = so(v.documento);
    if (!v.nome.trim()) return err.textContent = 'Informe o nome.';
    const pre = c.status === 'pre_cadastro' && v.status === 'pre_cadastro';
    if ((!pre || doc) && (v.tipo_pessoa === 'PF' ? !cpfValido(doc) : !cnpjValido(doc))) return err.textContent = v.tipo_pessoa === 'PF' ? 'CPF inválido.' : 'CNPJ inválido.';
    if (!/^\S+@\S+\.\S+$/.test(v.email)) return err.textContent = 'E-mail inválido.';
    let zap = so(v.whatsapp); if (zap.length === 10 || zap.length === 11) zap = '55' + zap;
    if (zap.length < 12) return err.textContent = 'WhatsApp inválido: use DDD + número.';
    if (!pre) for (const k of ['cep', 'logradouro', 'numero', 'bairro', 'cidade', 'uf']) if (!String(v[k] || '').trim()) return err.textContent = 'Preencha o endereço completo (usado no boleto).';
    const valor = Number(String(v.valor_mensal).replace(/\./g, '').replace(',', '.'));
    if (!(valor > 0)) return err.textContent = 'Informe o valor da mensalidade.';
    if (v.senha && v.senha.length < 6) return err.textContent = 'A senha precisa ter pelo menos 6 caracteres.';
    const dados = { nome: v.nome.trim(), tipo_pessoa: v.tipo_pessoa, documento: doc || null, email: v.email.trim().toLowerCase(), whatsapp: zap, telefone2: v.telefone2 || null,
      cep: so(v.cep), logradouro: v.logradouro.trim(), numero: v.numero.trim(), complemento: v.complemento || null, bairro: v.bairro.trim(), cidade: v.cidade.trim(), uf: v.uf.trim().toUpperCase(),
      valor_mensal: valor, dia_vencimento: Number(v.dia_vencimento), login_app: (v.login_app || v.email).trim().toLowerCase(), escuta_liberada: !!v.escuta_liberada, observacoes: v.observacoes || null };
    if (!novo) dados.status = v.status === 'pre_cadastro' ? 'pre_cadastro' : v.status === 'cancelado' ? 'cancelado' : (c.status === 'bloqueado' ? 'bloqueado' : 'ativo');
    const b = f.querySelector('[type=submit]');
    await rodar(b, async () => {
      const salvo = novo ? chk(await sb.from('clientes').insert(dados).select().single()) : chk(await sb.from('clientes').update(dados).eq('id', c.id).select().single());
      await sb.from('historico').insert({ cliente_id: salvo.id, tipo: novo ? 'cadastro' : 'edicao', detalhe: novo ? 'Cliente cadastrado' : (c.status === 'pre_cadastro' && dados.status === 'ativo' ? 'Pré-cadastro convertido em cliente' : 'Dados do cliente atualizados'), autor: sessao.user.email });
      let aviso = '';
      if (dados.status !== 'pre_cadastro') { try { const s = await api('sincronizar', { cliente_id: salvo.id, senha: v.senha || undefined }); if (!s.ok) aviso = ' ' + s.aviso; } catch (er) { aviso = ' Atenção: ' + er.message; } }
      fecharModal();
      if (v.senha) mostrarAcesso(dados.login_app, v.senha);
      toast((novo ? 'Cliente cadastrado.' : 'Alterações salvas.') + aviso, !!aviso && aviso.includes('Atenção'));
      abrirCliente(salvo.id); if (!novo) telaCliente(salvo.id);

    <label class="campo c4"><span>Situação</span><select name="ativo"><option value="1" ${v.ativo ? 'selected' : ''}>Ativo</option><option value="0" ${!v.ativo ? 'selected' : ''}>Inativo</option></select></label>

    <label class="campo c4"><span>Número do chip</span><input name="chip_numero" type="tel" value="${esc(v.chip_numero ? fmtFone(v.chip_numero) : '')}"></label>
    <label class="campo c3"><span>Operadora</span><input name="chip_operadora" value="${esc(v.chip_operadora)}"></label>
    <label class="campo c5"><span>ICCID (impresso no chip, começa com 89)</span><input name="chip_iccid" inputmode="numeric" maxlength="26" placeholder="8955 0000 0000 0000 000" value="${esc(v.chip_iccid)}"></label>
    <label class="chk c12"><input type="checkbox" name="escuta" ${v.escuta ? 'checked' : ''} ${cli.escuta_liberada ? '' : 'disabled'}> Liberar escuta (microfone) neste veículo ${cli.escuta_liberada ? '' : '<span class="mu pq">· marque "escuta contratada" no cadastro do cliente primeiro</span>'}</label>
    <div class="erro c12" id="fv-erro" role="alert"></div>
    <div class="acoes c12" style="justify-content:space-between">${novo ? '<span></span>' : '<button type="button" class="btn2 btn-vm" id="b-del-v">Remover veículo</button>'}<div class="acoes"><button type="button" class="btn2" data-x>Cancelar</button><button class="btn" type="submit">${novo ? 'Adicionar' : 'Salvar'}</button></div></div>
  </form>`);
  $$('[data-x]', m).forEach((b) => b.onclick = fecharModal);
  const f = $('#fv', m);
  if ($('#b-del-v', m)) $('#b-del-v', m).onclick = async () => { if (await confirmar('Remover ' + v.placa + '?', 'O veículo sai do cadastro do cliente.', 'Remover', true)) rodar(null, async () => { chk(await sb.from('veiculos').delete().eq('id', v.id)); await sb.from('historico').insert({ cliente_id: cli.id, tipo: 'veiculo', detalhe: 'Veículo ' + v.placa + ' removido', autor: sessao.user.email }); toast('Veículo removido.'); telaCliente(cli.id); }); };
  f.onsubmit = (e) => {
    e.preventDefault();
    const err = $('#fv-erro', m); err.textContent = '';
    const x = Object.fromEntries(new FormData(f).entries());
    const placa = (x.placa || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (!x.marca.trim() || !x.modelo.trim()) return err.textContent = 'Informe marca e modelo.';
    if (!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(placa)) return err.textContent = 'Placa inválida. Use o formato ABC1D23 ou ABC1234.';
    const imei = so(x.imei); if (imei && (imei.length < 14 || imei.length > 17)) return err.textContent = 'IMEI inválido.';
    let chip = so(x.chip_numero); if (chip.length === 10 || chip.length === 11) chip = '55' + chip;
    const iccid = so(x.chip_iccid); if (iccid && !/^89\d{16,20}$/.test(iccid)) return err.textContent = 'ICCID inválido: são 18 a 22 dígitos começando com 89 (impresso no chip).';
    const dados = { cliente_id: cli.id, tipo: x.tipo || 'carro', marca: x.marca.trim(), modelo: x.modelo.trim(), placa, ano: x.ano ? Number(x.ano) : null, cor: x.cor || null, ativo: x.ativo === '1', modelo_rastreador: x.modelo_rastreador || null, imei: imei || null, chip_numero: chip || null, chip_operadora: x.chip_operadora || null, chip_iccid: iccid || null, escuta: !!x.escuta };
    rodar(f.querySelector('[type=submit]'), async () => {
      if (novo) chk(await sb.from('veiculos').insert(dados)); else chk(await sb.from('veiculos').update(dados).eq('id', v.id));
      await sb.from('historico').insert({ cliente_id: cli.id, tipo: 'veiculo', detalhe: (novo ? 'Veículo adicionado: ' : 'Veículo atualizado: ') + dados.marca + ' ' + dados.modelo + ' · ' + placa, autor: sessao.user.email });
      let aviso = '';
      if (cli.traccar_user_id) { try { const s = await api('sincronizar', { cliente_id: cli.id }); if (!s.ok) aviso = ' ' + s.aviso; } catch (er) { aviso = ' Atenção: ' + er.message; } }
      fecharModal(); toast((novo ? 'Veículo adicionado.' : 'Veículo salvo.') + aviso); telaCliente(cli.id);
    });
  };
}

/* ---------- ordens de serviço e agenda de visitas ---------- */
const TIPOS_OS = { instalacao: 'Instalação', manutencao: 'Manutenção / reparo', retirada: 'Retirada' };
const STATUS_OS = { aberta: ['Agendada / aberta', 'b-ci'], em_execucao: ['Em execução', 'b-la'], concluida: ['Concluída', 'b-ok'], reprovada: ['Reprovada', 'b-vm'], cancelada: ['Cancelada', 'b-mu'] };
const PAG_OS = { pendente: 'Pagamento pendente', liberado: 'Pagamento liberado', bloqueado: 'Pagamento bloqueado', pago: 'Pago ao técnico' };
const TZ = 'America/Sao_Paulo';
const diaDe = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(d));
const horaDe = (d) => new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' }).format(new Date(d));
const quandoOS = (o) => o.agendada_para ? dataBR(diaDe(o.agendada_para)) + ' · ' + horaDe(o.agendada_para) : '<span class="mu">Sem data</span>';
const badgeOS = (o) => { const s = STATUS_OS[o.status] || [o.status, 'b-mu']; return `<span class="badge ${s[1]}">${esc(s[0])}</span>`; };
const enderecoCliente = (c) => c ? [[c.logradouro, c.numero].filter(Boolean).join(', '), c.complemento, c.bairro, [c.cidade, c.uf].filter(Boolean).join('/')].filter(Boolean).join(' · ') : '';
const SEL_OS = '*, clientes(id, nome, whatsapp, logradouro, numero, complemento, bairro, cidade, uf), veiculos(marca, modelo, placa), instaladores(nome)';
let OS_FILTRO = { mes: hoje().slice(0, 7), tipo: '', status: '', q: '' }, OS_CAL = hoje().slice(0, 7), OS_DIA = hoje();

async function telaOS() {
  const m = $('#main');
  m.innerHTML = `<div class="cab"><h1>Ordens de serviço</h1><button class="btn" id="b-nova-os">+ Nova OS</button></div><div class="vazio">Carregando…</div>`;
  let lista;
  try { lista = chk(await sb.from('ordens_servico').select(SEL_OS).order('agendada_para', { ascending: false, nullsFirst: true }).order('created_at', { ascending: false })); }
  catch (e) { m.querySelector('.vazio').textContent = e.message; return; }
  if (!$('#b-nova-os')) return;
  const ativas = lista.filter((o) => o.agendada_para && !['cancelada', 'concluida'].includes(o.status));
  const hj = hoje();
  const deHoje = ativas.filter((o) => diaDe(o.agendada_para) === hj).sort((a, b) => a.agendada_para.localeCompare(b.agendada_para));
  const futuras = ativas.filter((o) => diaDe(o.agendada_para) > hj).sort((a, b) => a.agendada_para.localeCompare(b.agendada_para)).slice(0, 15);
  const semData = lista.filter((o) => !o.agendada_para && !['cancelada', 'concluida'].includes(o.status));
  const itemAgenda = (o, comDia) => `<div class="ag-item" data-os="${o.id}"><div class="ag-hora">${comDia ? dataBR(diaDe(o.agendada_para)).slice(0, 5) + '<br>' : ''}${horaDe(o.agendada_para)}</div><div style="flex:1;min-width:0"><b>${esc(o.clientes?.nome || '')}</b> <span class="mu pq">OS ${o.numero} · ${esc(TIPOS_OS[o.tipo] || o.tipo)}</span><div class="mu pq" style="overflow:hidden;text-overflow:ellipsis">${esc(o.endereco_visita || enderecoCliente(o.clientes) || 'Endereço não informado')}${o.instaladores ? ' · ' + esc(o.instaladores.nome) : ' · <span style="color:var(--la)">sem técnico</span>'}</div></div></div>`;
  m.innerHTML = `<div class="cab"><h1>Ordens de serviço</h1><button class="btn" id="b-nova-os">+ Nova OS</button></div>
  <div class="grid2">
    <div class="painel"><h2>Visitas de hoje <span class="mu pq">${dataBR(hj)}</span></h2>${deHoje.length ? deHoje.map((o) => itemAgenda(o)).join('') : '<div class="mu pq" style="padding:8px 0">Nenhuma visita marcada para hoje.</div>'}
      ${semData.length ? `<div class="sec">SEM DATA MARCADA (${semData.length})</div>${semData.slice(0, 6).map((o) => `<div class="ag-item" data-os="${o.id}"><div class="ag-hora">—</div><div style="flex:1"><b>${esc(o.clientes?.nome || '')}</b> <span class="mu pq">OS ${o.numero} · ${esc(TIPOS_OS[o.tipo] || o.tipo)}</span><div class="pq" style="color:var(--la)">Toque para agendar</div></div></div>`).join('')}` : ''}</div>
    <div class="painel"><h2>Próximas visitas</h2>${futuras.length ? futuras.map((o) => itemAgenda(o, true)).join('') : '<div class="mu pq" style="padding:8px 0">Nenhuma visita futura agendada.</div>'}</div>
  </div>
  <div class="painel"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h2 style="margin:0;flex:1">Calendário de visitas</h2><button class="btn2 mini" id="cal-ant" aria-label="Mês anterior">‹</button><b id="cal-mes" style="min-width:150px;text-align:center"></b><button class="btn2 mini" id="cal-prox" aria-label="Próximo mês">›</button><button class="btn2 mini" id="cal-hoje">Hoje</button></div>
    <div class="cal" id="cal"></div><div id="cal-dia" style="margin-top:12px"></div></div>
  <div class="painel"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0;flex:1">Todas as ordens</h2><button class="btn2 mini" id="b-exportar">Exportar planilha</button></div>
    <div class="busca" style="margin-top:10px"><select id="f-per" aria-label="Período"><option value="mes">Mês</option><option value="tudo">Todo o período</option></select><input type="month" id="f-mes" aria-label="Mês" value="${OS_FILTRO.mes}">
      <select id="f-tipo" aria-label="Tipo"><option value="">Todos os tipos</option>${Object.entries(TIPOS_OS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
      <select id="f-st" aria-label="Situação"><option value="">Todas as situações</option>${Object.entries(STATUS_OS).map(([k, v]) => `<option value="${k}">${v[0]}</option>`).join('')}</select>
      <input id="f-q" placeholder="Buscar cliente, placa, técnico ou nº" style="flex:1 1 200px" aria-label="Buscar"></div>
    <div class="rolagem" id="os-lista"></div></div>`;
  $('#b-nova-os').onclick = () => formOS();
  $$('.ag-item').forEach((el) => el.onclick = () => formOS(lista.find((o) => o.id === el.dataset.os)));
  // calendário
  const desenharCal = () => {
    const [a, mm] = OS_CAL.split('-').map(Number), primeiro = new Date(Date.UTC(a, mm - 1, 1)), dias = new Date(Date.UTC(a, mm, 0)).getUTCDate();
    $('#cal-mes').textContent = primeiro.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric', timeZone: 'UTC' });
    const porDia = {};
    lista.filter((o) => o.agendada_para && o.status !== 'cancelada').forEach((o) => { const d = diaDe(o.agendada_para); (porDia[d] = porDia[d] || []).push(o); });
    let h = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map((d) => `<div class="cal-cab">${d}</div>`).join('');
    for (let i = 0; i < primeiro.getUTCDay(); i++) h += '<div></div>';
    for (let d = 1; d <= dias; d++) {
      const k = OS_CAL + '-' + String(d).padStart(2, '0'), it = (porDia[k] || []).sort((x, y) => x.agendada_para.localeCompare(y.agendada_para));
      h += `<button class="cal-dia${k === hj ? ' hoje' : ''}${k === OS_DIA ? ' sel' : ''}" data-dia="${k}"><span>${d}</span>${it.slice(0, 3).map((o) => `<i class="${o.status === 'concluida' ? 'ok' : ''}">${horaDe(o.agendada_para)} ${esc((o.clientes?.nome || '').split(' ')[0])}</i>`).join('')}${it.length > 3 ? `<i>+${it.length - 3}</i>` : ''}</button>`;
    }
    $('#cal').innerHTML = h;
    $$('.cal-dia').forEach((b) => b.onclick = () => { OS_DIA = b.dataset.dia; desenharCal(); });
    const doDia = (porDia[OS_DIA] || []).sort((x, y) => x.agendada_para.localeCompare(y.agendada_para));
    $('#cal-dia').innerHTML = `<div class="sec" style="margin-top:0">VISITAS DE ${dataBR(OS_DIA)}</div>${doDia.length ? doDia.map((o) => itemAgenda(o)).join('') : '<div class="mu pq">Nenhuma visita neste dia.</div>'}<button class="btn2 mini" id="b-os-dia" style="margin-top:8px">+ Agendar neste dia</button>`;
    $$('#cal-dia .ag-item').forEach((el) => el.onclick = () => formOS(lista.find((o) => o.id === el.dataset.os)));
    $('#b-os-dia').onclick = () => formOS(null, { dia: OS_DIA });
  };
  const mudaMes = (n) => { const [a, mm] = OS_CAL.split('-').map(Number), d = new Date(Date.UTC(a, mm - 1 + n, 1)); OS_CAL = d.toISOString().slice(0, 7); desenharCal(); };
  $('#cal-ant').onclick = () => mudaMes(-1); $('#cal-prox').onclick = () => mudaMes(1);
  $('#cal-hoje').onclick = () => { OS_CAL = hj.slice(0, 7); OS_DIA = hj; desenharCal(); };
  desenharCal();
  // lista com filtros
  $('#f-per').value = OS_FILTRO.mes ? 'mes' : 'tudo'; $('#f-tipo').value = OS_FILTRO.tipo; $('#f-st').value = OS_FILTRO.status; $('#f-q').value = OS_FILTRO.q;
  const filtradas = () => {
    const q = OS_FILTRO.q.trim().toLowerCase();
    return lista.filter((o) => {
      if (OS_FILTRO.mes && diaDe(o.agendada_para || o.created_at).slice(0, 7) !== OS_FILTRO.mes) return false;
      if (OS_FILTRO.tipo && o.tipo !== OS_FILTRO.tipo) return false;
      if (OS_FILTRO.status && o.status !== OS_FILTRO.status) return false;
      if (q && ![String(o.numero), o.clientes?.nome, o.veiculos?.placa, o.instaladores?.nome].filter(Boolean).join(' ').toLowerCase().includes(q)) return false;
      return true;
    });
  };
  const desenharLista = () => {
    $('#f-mes').disabled = !OS_FILTRO.mes;
    const l = filtradas();
    $('#os-lista').innerHTML = l.length ? `<table class="tab"><thead><tr><th>Nº</th><th>Tipo</th><th>Cliente</th><th>Veículo</th><th>Visita</th><th>Técnico</th><th>Situação</th></tr></thead><tbody>${l.map((o) => `<tr class="click" data-os="${o.id}"><td><b>${o.numero}</b></td><td>${esc(TIPOS_OS[o.tipo] || o.tipo)}</td><td>${esc(o.clientes?.nome || '')}<div class="mu pq">${esc(o.endereco_visita || enderecoCliente(o.clientes))}</div></td><td>${o.veiculos ? esc(o.veiculos.marca + ' ' + o.veiculos.modelo) + '<div class="mu pq">' + esc(o.veiculos.placa || '') + '</div>' : '—'}</td><td style="white-space:nowrap">${quandoOS(o)}</td><td>${esc(o.instaladores?.nome || '—')}</td><td>${badgeOS(o)}<div class="mu pq">${esc(PAG_OS[o.pagamento_status] || '')}</div></td></tr>`).join('')}</tbody></table><div class="mu pq" style="padding:8px 4px">${l.length} ordem(ns)</div>` : '<div class="vazio">Nenhuma ordem de serviço neste filtro.</div>';
    $$('#os-lista [data-os]').forEach((tr) => tr.onclick = () => formOS(lista.find((o) => o.id === tr.dataset.os)));
  };
  $('#f-per').onchange = () => { OS_FILTRO.mes = $('#f-per').value === 'mes' ? ($('#f-mes').value || hoje().slice(0, 7)) : ''; desenharLista(); };
  $('#f-mes').onchange = () => { if ($('#f-mes').value) { OS_FILTRO.mes = $('#f-mes').value; desenharLista(); } };
  $('#f-tipo').onchange = () => { OS_FILTRO.tipo = $('#f-tipo').value; desenharLista(); };
  $('#f-st').onchange = () => { OS_FILTRO.status = $('#f-st').value; desenharLista(); };
  $('#f-q').oninput = () => { OS_FILTRO.q = $('#f-q').value; desenharLista(); };
  $('#b-exportar').onclick = () => exportarOS(filtradas());
  desenharLista();
}

function exportarOS(l) {
  if (!l.length) return toast('Nada para exportar neste filtro.', true);
  const num = (v) => v == null ? '' : String(Number(v).toFixed(2)).replace('.', ',');
  const dt = (d) => d ? dataBR(diaDe(d)) : '', hr = (d) => d ? horaDe(d) : '';
  const cab = ['Nº', 'Tipo', 'Situação', 'Pagamento do técnico', 'Cliente', 'WhatsApp do cliente', 'Veículo', 'Placa', 'Data da visita', 'Hora', 'Endereço da visita', 'Técnico', 'Valor do técnico (R$)', 'Criada em', 'Iniciada em', 'Concluída em', 'Responsável no local', 'Descrição do serviço', 'Observações finais'];
  const linhas = l.map((o) => [o.numero, TIPOS_OS[o.tipo] || o.tipo, (STATUS_OS[o.status] || [o.status])[0], PAG_OS[o.pagamento_status] || o.pagamento_status, o.clientes?.nome || '', o.clientes?.whatsapp ? fmtFone(o.clientes.whatsapp) : '',
    o.veiculos ? o.veiculos.marca + ' ' + o.veiculos.modelo : '', o.veiculos?.placa || '', dt(o.agendada_para), hr(o.agendada_para), o.endereco_visita || enderecoCliente(o.clientes), o.instaladores?.nome || '', num(o.valor_instalador),
    dt(o.created_at), dt(o.iniciada_em), dt(o.concluida_em), o.responsavel_nome || '', o.descricao_servico || '', o.observacoes_finais || '']);
  const csv = '﻿' + [cab, ...linhas].map((r) => r.map((v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ordens-de-servico-' + (OS_FILTRO.mes || 'todo-periodo') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();

  const linhaInteg = (nome, ok, falta) => `<div class="integ"><div><b>${nome}</b><div class="mu pq">${ok ? 'Conectado' : 'Falta configurar: ' + falta}</div></div>${ok ? '<span class="badge b-ok">Ativo</span>' : '<span class="badge b-mu">Simulado</span>'}</div>`;
  const tpl = C.whatsapp_templates || {};
  const OF = { preco_cheio: 64.9, preco_promo: 54.9, meses_promo: 12, instalacao_cheia: 99.9, instalacao_promo: 49.95, data_estreia: '2027-01-04', ...(C.oferta || {}) };
  const fmtNum = (n) => Number(n).toFixed(2).replace('.', ',');
  m.innerHTML = `<div class="cab"><h1>Configurações</h1></div>
  <div class="grid2">
    <div class="painel"><h2>Integrações</h2>
      ${linhaInteg('Servidor do rastreador (Traccar)', integ.traccar, 'TRACCAR_URL, TRACCAR_ADMIN_EMAIL, TRACCAR_ADMIN_SENHA')}
      ${linhaInteg('Mercado Pago (boleto e Pix)', integ.mercadopago, 'MP_ACCESS_TOKEN')}
      ${linhaInteg('E-mail (Resend)', integ.email, 'RESEND_API_KEY, EMAIL_REMETENTE')}
      ${linhaInteg('WhatsApp (API oficial da Meta)', integ.whatsapp, 'WHATSAPP_TOKEN, WHATSAPP_PHONE_ID')}
      <p class="mu pq" style="line-height:1.6;margin:14px 0 6px">Enquanto uma integração está em "Simulado", o sistema registra o que faria em Mensagens, sem enviar nada de verdade.</p>
      <p class="pq" style="margin:10px 0 4px"><b>URL de notificações para o Mercado Pago</b> ${integ.mp_assinatura ? '<span class="badge b-ok">assinatura conferida</span>' : ''}</p>
      <div style="display:flex;gap:8px;align-items:center"><code style="flex:1">${esc(integ.webhook_url)}</code><button class="btn2 mini" id="cp-wh">Copiar</button></div>
    </div>
    <div class="painel"><h2>Regras de cobrança</h2>
      <form class="form" id="fcfg">
        <label class="campo c6"><span>Nome nas mensagens</span><input name="nome_empresa" value="${esc(C.nome_empresa)}"></label>
        <label class="campo c6"><span>Gerar cobrança quantos dias antes</span><input name="dias_antecedencia_cobranca" type="number" min="1" max="25" value="${esc(C.dias_antecedencia_cobranca)}"></label>
        <label class="campo c6"><span>Lembretes (dias antes; 0 = no dia)</span><input name="dias_lembrete" value="${esc((C.dias_lembrete || []).join(', '))}"></label>
        <label class="campo c6"><span>Bloquear após quantos dias úteis de atraso</span><input name="dias_uteis_bloqueio" type="number" min="1" max="15" value="${esc(C.dias_uteis_bloqueio)}"></label>
        <p class="mu pq c12" style="margin:0;line-height:1.6">Exemplo com 2: venceu na sexta, a tolerância é segunda e terça, e o bloqueio acontece na quarta, na rotina das ${esc(horario)}.</p>
        <label class="campo c6"><span>Horário da rotina diária (Brasília)</span><input name="horario_rotina" type="time" value="${esc(horario)}"></label>
        <div class="sec">MODELOS DO WHATSAPP (NOME APROVADO NA META)</div>
        ${['cobranca', 'lembrete', 'vencida', 'bloqueio', 'pagamento', 'pre_cadastro'].map((k) => `<label class="campo c4"><span>${{ cobranca: 'Nova cobrança', lembrete: 'Lembrete', vencida: 'Atraso', bloqueio: 'Bloqueio', pagamento: 'Pagamento', pre_cadastro: 'Pré-cadastro' }[k]}</span><input name="tpl_${k}" value="${esc(tpl[k] || '')}"></label>`).join('')}
        <div class="acoes c12" style="justify-content:flex-end"><button class="btn">Salvar regras</button></div>
      </form>
    </div>
  </div>
  <div class="grid2">
    <div class="painel"><h2>Oferta e preços</h2>
      <p class="mu pq" style="line-height:1.6;margin:0 0 10px">Valores mostrados no app (tela de pré-cadastro e contagem para a estreia) e usados nos novos pré-cadastros e nas mensagens. Quem já se pré-cadastrou mantém o valor que garantiu.</p>
      <form class="form" id="foferta">
        <label class="campo c6"><span>Mensalidade normal (R$)</span><input name="preco_cheio" inputmode="decimal" value="${esc(fmtNum(OF.preco_cheio))}"></label>
        <label class="campo c6"><span>Mensalidade promocional (R$)</span><input name="preco_promo" inputmode="decimal" value="${esc(fmtNum(OF.preco_promo))}"></label>
        <label class="campo c6"><span>Meses com o preço promocional</span><input name="meses_promo" type="number" min="1" max="60" value="${esc(OF.meses_promo)}"></label>
        <label class="campo c6"><span>Data de estreia do app</span><input name="data_estreia" type="date" value="${esc(OF.data_estreia)}"></label>
        <label class="campo c6"><span>Instalação normal (R$)</span><input name="instalacao_cheia" inputmode="decimal" value="${esc(fmtNum(OF.instalacao_cheia))}"></label>
        <label class="campo c6"><span>Instalação promocional (R$)</span><input name="instalacao_promo" inputmode="decimal" value="${esc(fmtNum(OF.instalacao_promo))}"></label>
        <div class="acoes c12" style="justify-content:flex-end"><button class="btn">Salvar oferta</button></div>
      </form>
    </div>
    <div class="painel"><h2>Modelos do WhatsApp na Meta</h2>
      <p class="mu pq" style="line-height:1.6;margin:0 0 10px">A Meta precisa aprovar cada modelo antes de o sistema enviar mensagens por ele.</p>
      <div class="busca"><input id="waba" value="${esc(C.whatsapp_waba_id || '')}" placeholder="Identificação da conta (WABA)" aria-label="Identificação da conta do WhatsApp (WABA)" style="flex:1 1 200px"><button class="btn2" id="b-waba">Salvar</button><button class="btn" id="b-modelos">Conferir na Meta</button></div>
      <div id="modelos" class="rolagem"><div class="mu pq" style="padding:6px 0">Toque em "Conferir na Meta" para ver a situação de cada modelo.</div></div>
      <div class="sec">ENVIAR MENSAGEM DE TESTE</div>
      <div class="busca"><select id="t-tipo" aria-label="Modelo">${['cobranca', 'lembrete', 'vencida', 'bloqueio', 'pagamento', 'pre_cadastro'].map((k) => `<option value="${k}">${esc({ cobranca: 'Nova cobrança', lembrete: 'Lembrete', vencida: 'Atraso', bloqueio: 'Bloqueio', pagamento: 'Pagamento', pre_cadastro: 'Pré-cadastro' }[k])}${tpl[k] ? ' · ' + esc(tpl[k]) : ''}</option>`).join('')}</select><input id="t-fone" type="tel" placeholder="Seu WhatsApp com DDD" aria-label="WhatsApp que recebe o teste" style="flex:1 1 160px"><button class="btn2" id="b-teste">Enviar teste</button></div>
      <p class="mu pq" style="margin:6px 0 0;line-height:1.5">A mensagem sai de verdade, com dados de exemplo. Só funciona depois que o modelo estiver aprovado.</p>
    </div>
  </div>

  <div class="painel"><h2>Feriados (não contam como dia útil)</h2>
    <div class="busca"><input type="date" id="fer-d" aria-label="Data"><input id="fer-n" placeholder="Nome do feriado" style="flex:1 1 220px" aria-label="Nome do feriado"><button class="btn2" id="fer-add">Adicionar</button></div>
    <div class="rolagem"><table class="tab"><tbody>${fer.map((x) => `<tr><td style="white-space:nowrap">${dataBR(x.data)}</td><td>${esc(x.nome)}</td><td style="text-align:right"><button class="btn2 mini" data-fer="${x.data}">Remover</button></td></tr>`).join('')}</tbody></table></div>
  </div>`;
  $('#cp-wh').onclick = () => copiar(integ.webhook_url);
  $('#foferta').onsubmit = (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target)), num = (x) => Number(String(x || '').replace(/\./g, '').replace(',', '.'));
    const of = { preco_cheio: num(v.preco_cheio), preco_promo: num(v.preco_promo), meses_promo: Math.round(Number(v.meses_promo)), instalacao_cheia: num(v.instalacao_cheia), instalacao_promo: num(v.instalacao_promo), data_estreia: v.data_estreia };
    if (!(of.preco_cheio > 0 && of.preco_promo > 0 && of.instalacao_cheia > 0 && of.instalacao_promo >= 0)) return toast('Preencha todos os valores.', true);
    if (of.preco_promo > of.preco_cheio || of.instalacao_promo > of.instalacao_cheia) return toast('O preço promocional não pode ser maior que o normal.', true);
    if (!(of.meses_promo >= 1)) return toast('Informe os meses da promoção.', true);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(of.data_estreia || '')) return toast('Informe a data de estreia.', true);
    rodar(e.target.querySelector('.btn'), async () => { chk(await sb.from('configuracoes').upsert({ chave: 'oferta', valor: of })); toast('Oferta salva. O app já mostra os novos valores.'); });
  };
  $('#b-waba').onclick = (e) => rodar(e.currentTarget, async () => { chk(await sb.from('configuracoes').upsert({ chave: 'whatsapp_waba_id', valor: so($('#waba').value) })); toast('Conta do WhatsApp salva.'); });
  $('#b-modelos').onclick = (e) => rodar(e.currentTarget, async () => {
    const r = await api('whatsapp_modelos'), ST = { APPROVED: ['Aprovado', 'b-ok'], PENDING: ['Em análise', 'b-ci'], REJECTED: ['Rejeitado', 'b-vm'], PAUSED: ['Pausado', 'b-la'], DISABLED: ['Desativado', 'b-mu'], IN_APPEAL: ['Em recurso', 'b-la'] };
    const usados = new Set(Object.values(tpl).filter(Boolean));
    const lista = r.modelos.filter((x) => usados.has(x.nome)).concat(r.modelos.filter((x) => !usados.has(x.nome)));
    $('#modelos').innerHTML = lista.length ? `<table class="tab"><tbody>${lista.map((x) => { const st = ST[x.status] || [x.status, 'b-mu']; return `<tr><td><code>${esc(x.nome)}</code><div class="mu pq">${esc(x.categoria || '')} · ${esc(x.idioma || '')}${usados.has(x.nome) ? '' : ' · não usado'}</div></td><td style="text-align:right"><span class="badge ${st[1]}">${esc(st[0])}</span>${x.motivo ? `<div class="pq" style="color:#ffb38a">${esc(x.motivo)}</div>` : ''}</td></tr>`; }).join('')}</tbody></table>` : '<div class="vazio">Nenhum modelo encontrado nesta conta.</div>';
  });
  $('#b-teste').onclick = (e) => {
    const fone = so($('#t-fone').value);
    if (fone.length < 10) return toast('Informe o WhatsApp com DDD.', true);
    rodar(e.currentTarget, async () => { const r = await api('whatsapp_teste', { tipo: $('#t-tipo').value, telefone: fone, nome: sessao.user.email.split('@')[0] }); toast('Teste enviado (' + r.modelo + ').'); });
  };

  $('#fcfg').onsubmit = (e) => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    const lem = String(v.dias_lembrete).split(/[,\s]+/).filter(Boolean).map(Number).filter((n) => n >= 0 && n <= 30);
    const regs = [
      { chave: 'nome_empresa', valor: v.nome_empresa || 'RJ Domótica' },
      { chave: 'dias_antecedencia_cobranca', valor: Math.max(1, Number(v.dias_antecedencia_cobranca) || 10) },
      { chave: 'dias_lembrete', valor: [...new Set(lem)].sort((a, b) => b - a) },
      { chave: 'dias_uteis_bloqueio', valor: Math.max(1, Number(v.dias_uteis_bloqueio) || 2) },
      { chave: 'whatsapp_templates', valor: { ...tpl, ...Object.fromEntries(['cobranca', 'lembrete', 'vencida', 'bloqueio', 'pagamento', 'pre_cadastro'].map((k) => [k, (v['tpl_' + k] || '').trim()])) } },
    ];
    rodar(e.target.querySelector('.btn'), async () => {
      for (const r of regs) chk(await sb.from('configuracoes').update({ valor: r.valor }).eq('chave', r.chave));
      if (v.horario_rotina && v.horario_rotina !== horario) { const [hh, mm] = v.horario_rotina.split(':').map(Number); const r = await sb.rpc('definir_horario_rotina', { p_hora: hh, p_minuto: mm }); if (r.error) throw new Error(r.error.message); horario = r.data; }
      toast('Regras salvas.'); telaConfig();
    });
  };
  $('#fer-add').onclick = (e) => { const d = $('#fer-d').value, n = $('#fer-n').value.trim(); if (!d || !n) return toast('Informe a data e o nome.', true); rodar(e.currentTarget, async () => { chk(await sb.from('feriados').upsert({ data: d, nome: n })); telaConfig(); }); };
  $$('[data-fer]').forEach((b) => b.onclick = () => rodar(b, async () => { chk(await sb.from('feriados').delete().eq('data', b.dataset.fer)); telaConfig(); }));
}

/* ---------- criar senha pelo link de acesso (#acesso=código) ---------- */
let codigoAcesso = (location.hash.match(/acesso=([^&]+)/) || [])[1] || '';
if (codigoAcesso) {
  $('#app').classList.add('oculto'); $('#login').classList.remove('oculto');
  $('#f-login').classList.add('oculto'); $('#f-nova-senha').classList.remove('oculto');
  $('#f-nova-senha').addEventListener('submit', async (e) => {
    e.preventDefault();
    const a = $('#ns-1').value, b = $('#ns-2').value, err = $('#ns-erro'), btn = e.target.querySelector('.btn');
    err.textContent = '';
    if (a.length < 8) return err.textContent = 'A senha precisa ter pelo menos 8 caracteres.';
    if (a !== b) return err.textContent = 'As duas senhas não são iguais.';
    btn.disabled = true;
    const v = await sb.auth.verifyOtp({ token_hash: codigoAcesso, type: 'recovery' });
    if (v.error) { btn.disabled = false; return err.textContent = 'Este link expirou ou já foi usado. Peça um novo link a outro administrador.'; }
    const r = await sb.auth.updateUser({ password: a });
    btn.disabled = false;
    if (r.error) return err.textContent = r.error.message;
    codigoAcesso = '';
    history.replaceState(null, '', location.pathname);
    $('#f-nova-senha').classList.add('oculto'); $('#f-login').classList.remove('oculto');
    iniciar();
  });
} else iniciar();
</script>
</body>
</html>
